      - page: 2
        sentence: "This study aims to provide an overview of the coastal shallow-water habitats of Mauritania, including seagrass beds, maerl beds, and tidal mudflats, and to catalogue the most abundant macrozoobenthic invertebrate species present in this environment additionally highlighting their most outstanding morphological characteristics."
      - page: 5
        sentence: "The seagrass beds around Kijji island are located along a sandy area and rooted within an old oyster shell bed. Hard substrate habitats were investigated along the rocky shores of Cap Blanc, the sandstone tide pools of Pelican island (Fig. 2H) in front of the Bellaat lagoon entrance, the rocky shoreline at Cansado, an old stone pier at Agadir and the rocky island in the Baie de l’Étoile. The submerged ridge field off the Cap Sainte Anne coastal plain with its octocoral forest habitats was additionally investigated (Fig. 2G)."
        
